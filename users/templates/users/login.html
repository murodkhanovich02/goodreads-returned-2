{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %} Goodreads Login Page {% endblock title %}

{% block content %}

<h3>Login</h3>
<div class="row">
    <div class="col-4">
        <form method="POST">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-success">Login</button>
        </form>
    </div>
</div>

{% endblock content %}

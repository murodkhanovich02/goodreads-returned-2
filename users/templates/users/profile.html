{% extends 'base.html' %}

{% block title %} Goodreads Profile Page {% endblock title %}

{% block content %}

<h1>Profile Page</h1>

<img class="profile-pic" src="{{ user.profile_picture.url }}" alt="Profile picture">

<br>
User name: {{ user.username }}<br>
First name: {{ user.first_name }}<br>
Last name: {{ user.last_name }}<br>
Email: {{ user.email }}

<div>
    <a href="{% url 'users:profile-edit' %}">Profile Edit</a><br>
</div>

{% endblock content %}

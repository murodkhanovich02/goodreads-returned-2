{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Goodreads Profile Edit{% endblock title %}

{% block content %}
<h1>Edit Profile Page</h1>
<div class="row">
    <div class="col-3">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit">Save Changes</button>
        </form>
    </div>
</div>
{% endblock content %}
